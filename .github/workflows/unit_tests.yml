name: Unit tests

on:
  workflow_dispatch:
    inputs:
      test_dbs_ref:
        description: >-
          Run the library tests against DBs built from this branch/tag of the CV repos
          (e.g. esgvoc_dev) instead of the registry ones. Empty: registry DBs.
        required: false
        default: ""
        type: string

  push:
    branches:
      - integration
    paths:
      - src/**
      - tests/**
      - pyproject.toml

  pull_request:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - pyproject.toml

jobs:
  library_tests:
    name: Library tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync

      - name: Build test DBs
        if: inputs.test_dbs_ref != ''
        run: uv run python tests/build_test_dbs.py "${{ runner.temp }}/test_dbs" --ref "${{ inputs.test_dbs_ref }}"

      - name: Library Tests
        env:
          ESGVOC_TEST_DBS_DIR: ${{ inputs.test_dbs_ref != '' && format('{0}/test_dbs', runner.temp) || '' }}
        run: uv run pytest tests

  cv_tests:
    name: CV ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - cmip7
          - cmip6plus
          - cmip6
          - input4mips
          - obs4ref
          - cordex-cmip6
          - cordex-cmip5
          - emd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync

      - name: Test ${{ matrix.project }}
        run: uv run esgvoc test run ${{ matrix.project }} --branch esgvoc_dev --universe-branch esgvoc_dev
